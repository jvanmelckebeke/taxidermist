traits:
- core
required:
- type
- title
- topic
- date
optional:
- tags
- people
- status
- review
- reviewer
- source
required_when:
  review:
    status: final
fields:
  status:
    value: str
    definitions:
      draft: Still being written.
      final: Done; a reviewer has signed off.
    guidance: The note's own lifecycle.
  review:
    value: object
    schema:
      open:
        value: bool
        required: true
        guidance: false once the review is done.
      when:
        value: date
        guidance: When to look again.
    guidance: The review a final note went through.
  reviewer:
    value: list
    reference: people
    reference_type: person
    members: skills
    guidance: Who reviewed it, as a person (`alice`) or as the skill they reviewed it for (`alice::go`).
  source:
    value: str
    guidance: Where the note came from, as a path through the layers below. A path may stop at any layer.
    definitions:
      books:
        means: Printed or e-books.
        children:
          fiction:
            means: Invented stories.
            children:
              thriller: Suspense-driven plots.
              horror: Fear as the point.
          nonfiction: Factual works.
      movies: Feature films.
