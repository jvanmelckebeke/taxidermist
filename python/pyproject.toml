[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "taxidermist"
dynamic = ["version"]
description = "Check markdown frontmatter against a taxonomy, through the taxidermist binary"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/jvanmelckebeke/taxidermist"

[tool.hatch.build.targets.wheel]
packages = ["src/taxidermist"]

# The version is the repo's git tag, as for the Go binary.
[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }
