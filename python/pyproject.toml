[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxidermist"
version = "0.6.0"
description = "Check markdown frontmatter against a taxonomy, through the taxidermist binary"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/jvanmelckebeke/taxidermist"

[tool.hatch.build.targets.wheel]
packages = ["src/taxidermist"]
