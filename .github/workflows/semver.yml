name: semver

on:
  push:
    branches: [main]

# Runs queue one after another. GitHub keeps one pending run per group and
# cancels older pending ones, which is safe because each run tags every
# merge since the latest tag.
concurrency:
  group: semver-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: next
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git fetch --tags --force origin
        last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
        range=${last:+$last..}HEAD
        labels=$(git rev-list "$range" | while read -r sha; do
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .labels[].name'
        done | sort -u)
        if grep -qx 'semver:major' <<< "$labels"; then bump=major
        elif grep -qx 'semver:minor' <<< "$labels"; then bump=minor
        elif grep -qx 'semver:patch' <<< "$labels"; then bump=patch
        else echo "no semver label since ${last:-the start}, no release"; exit 0
        fi
        IFS=. read -r major minor patch <<< "${last#v}"
        case $bump in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        tag="v$major.$minor.$patch"
        git tag "$tag"
        git push origin "$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    # A tag pushed with GITHUB_TOKEN does not trigger release.yml, so call it here.
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
