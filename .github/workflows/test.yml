name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test ./...
    - run: python3 -m venv .venv && .venv/bin/pip install ./python pytest
    - run: .venv/bin/pytest python/tests
